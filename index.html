<style>
:root{
  --blue:#013CC0;--pink:#FF006B;--white:#fff;
  --display:"Monument Extended","Helvetica Neue",Arial,sans-serif;
  --u:min(1.8vw,1.25svh);
  color-scheme:dark;
}
/* Layout: scena fissa a schermo intero, blu fuori e rosa dentro la scatola; lo scroll guida parole, apertura e ingresso. */
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--blue)}
body{background:var(--blue);color:var(--white);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.track{height:1500svh}
.scene{position:fixed;inset:0;-webkit-transform:translateZ(0);background:var(--blue);perspective:1600px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.bar{position:fixed;top:0;left:0;height:3px;width:100%;background:var(--pink);transform-origin:0 50%;transform:scaleX(0);z-index:30}
.brand path{fill:var(--logo,#fff)}
.count{color:var(--cnt,#fff)}
.brand{position:fixed;top:max(12px,env(safe-area-inset-top));left:16px;height:24px;width:auto;display:block;z-index:30}
.count{position:fixed;top:max(18px,env(safe-area-inset-top));right:16px;font-size:11px;letter-spacing:.14em;font-variant-numeric:tabular-nums;z-index:30;}
.probe{position:absolute;width:var(--u);height:1px;visibility:hidden}
.words{position:absolute;inset:0;z-index:0;padding:0 3vw;display:flex;flex-direction:column;justify-content:center;align-items:center}
.line{width:100%;overflow:hidden;display:flex;justify-content:center;padding-top:.22em;margin-top:-.22em;line-height:.98;font-size:60px}
.row{display:inline-flex;white-space:nowrap;gap:.32em;font-size:1em;line-height:.98;}
.vt svg{display:block;overflow:visible;fill:currentColor;stroke:currentColor;stroke-linejoin:round;paint-order:stroke fill}
.wd{display:inline-block;transform:translateY(145%);opacity:0}
.pos{position:relative;width:0;height:0;z-index:2;transform-style:preserve-3d}
.box{position:relative;width:0;height:0;transform-style:preserve-3d}
.f,.p{position:absolute;transform-style:preserve-3d}
.f::before,.f::after,.p::before,.p::after{content:"";position:absolute;inset:0;border:1.5px solid var(--pink);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.f::before,.p::before{background:var(--tint,#fff)}
.f::after,.p::after{background:var(--tin,#fff);border-color:var(--blue);transform:rotateY(180deg)}
.front,.back{width:calc(var(--u)*34);height:calc(var(--u)*17);margin:calc(var(--u)*-8.5) 0 0 calc(var(--u)*-17)}
.front{--tint:#fff;--tin:#eef2ff;transform:translateZ(calc(var(--u)*14))}
.back{--tint:#eef2ff;--tin:#eef2ff;transform:rotateY(180deg) translateZ(calc(var(--u)*14))}
.right,.left{width:calc(var(--u)*28);height:calc(var(--u)*17);margin:calc(var(--u)*-8.5) 0 0 calc(var(--u)*-14)}
.right{--tint:#eaf0ff;--tin:#dde6fb;transform:rotateY(90deg) translateZ(calc(var(--u)*17))}
.left{--tint:#dde6fb;--tin:#dde6fb;transform:rotateY(-90deg) translateZ(calc(var(--u)*17))}
.bottom{--tint:#fff;--tin:#fff;width:calc(var(--u)*34);height:calc(var(--u)*28);margin:calc(var(--u)*-14) 0 0 calc(var(--u)*-17);transform:rotateX(-90deg) translateZ(calc(var(--u)*8.5))}
.hole{position:absolute;width:calc(var(--u)*2.4);height:calc(var(--u)*2.4);border-radius:50%;background:var(--pink);bottom:calc(var(--u)*3.2);backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:translateZ(1px)}
.right .hole{left:calc(var(--u)*3)}
.left .hole{right:calc(var(--u)*3)}
.lid{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;transform:translate3d(0,calc(var(--u)*-8.5),calc(var(--u)*-14)) rotateX(var(--lid,0deg))}
.top{--tint:#fff;left:calc(var(--u)*-17);top:0;width:calc(var(--u)*34);height:calc(var(--u)*28);transform-origin:50% 0;transform:rotateX(90deg)}
.lip-f{--tint:#fff;left:calc(var(--u)*-17);top:0;width:calc(var(--u)*34);height:calc(var(--u)*2.6);transform:translateZ(calc(var(--u)*28))}
.lip-r{--tint:#eaf0ff;left:calc(var(--u)*-14);top:0;width:calc(var(--u)*28);height:calc(var(--u)*2.6);transform:translate3d(calc(var(--u)*17),0,calc(var(--u)*14)) rotateY(90deg)}
.lip-l{--tint:#dde6fb;left:calc(var(--u)*-14);top:0;width:calc(var(--u)*28);height:calc(var(--u)*2.6);transform:translate3d(calc(var(--u)*-17),0,calc(var(--u)*14)) rotateY(-90deg)}
.qrl{position:absolute;left:calc(var(--u)*-17);top:0;width:calc(var(--u)*34);height:calc(var(--u)*28);transform-origin:50% 0;transform:rotateX(90deg) translateZ(1px);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center}
.qrl svg{width:calc(var(--u)*15);height:calc(var(--u)*15);display:block}
.hint svg{margin:0 auto}
.hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 2svh);text-align:center;z-index:5;font-size:11px;letter-spacing:.16em;transition:opacity .3s}
.inside{position:fixed;inset:0;z-index:25;pointer-events:none}
.card{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:16px;padding:0 24px;opacity:0}
.tag{color:var(--pink);font-size:11px;letter-spacing:.16em;font-variant-numeric:tabular-nums}
h2{color:var(--blue);font-weight:400;paint-order:stroke fill;line-height:1.12;text-wrap:balance;font-size:clamp(22px,7vw,52px);max-width:none}
p{color:var(--blue);font-size:clamp(11px,3.1vw,16px);line-height:1.6;max-width:none;letter-spacing:.01em}
.mail{padding:8px 0;display:block;color:var(--blue);font-size:min(28px,calc((100vw - 64px)/23));max-width:calc(100vw - 48px);text-decoration:none}
.btn{min-height:48px;display:inline-flex;align-items:center;justify-content:center;margin-top:10px;padding:15px 26px;background:var(--pink);color:#fff;border-radius:999px;text-decoration:none;font-size:12px;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.note{position:absolute;left:24px;right:24px;bottom:calc(env(safe-area-inset-bottom) + 44px);color:var(--blue);font-size:8.5px;opacity:0;transition:opacity .35s;pointer-events:none}
.note svg{margin:0 auto}
@media (max-height:520px) and (orientation:landscape){.card{gap:8px;padding-bottom:34px}h2{font-size:clamp(18px,6.2vh,30px)}.btn{margin-top:4px;min-height:44px;padding:10px 24px}.note{bottom:calc(env(safe-area-inset-bottom) + 8px)}}
.end{color:var(--pink);border-top:1px solid var(--pink);padding-top:12px;margin-top:6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
@media (min-width:900px){:root{--u:min(1.2vw,1.35svh)}p{font-size:17px}}
@media (prefers-reduced-motion:reduce){
  .track{height:auto}
  .scene{position:relative;height:100svh}
  .inside{position:static;background:#fff;pointer-events:auto}
  .card{position:static;opacity:1;min-height:70svh;pointer-events:auto}
  .note{position:static;opacity:.85;margin:24px}
  .hint{display:none}
}
</style>
</head>
